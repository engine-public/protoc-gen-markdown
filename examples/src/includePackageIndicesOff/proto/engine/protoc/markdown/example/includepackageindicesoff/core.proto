syntax = "proto3";

package engine.protoc.markdown.example.includepackageindicesoff;

option java_package = "com.engine.protoc.markdown.example.includepackageindicesoff";
option java_multiple_files = true;

// Core domain definitions for the package.
//
// Paired with `events.proto` in the same proto package to exercise the
// `includePackageIndices=false` path: under the default `outputType=PER_FILE` the
// default `includePackageIndices=true` also emits a per-package `package.md` index;
// with this suite's `includePackageIndices=false` only the two per-file `.md`s are
// produced — no package index.

// A user of the system.
message User {
    // Stable identifier.
    string id = 1;

    // Display name.
    string name = 2;

    // The user's role in the system.
    UserRole role = 3;
}

// The role a user is assigned.
enum UserRole {
    USER_ROLE_UNSPECIFIED = 0;
    USER_ROLE_MEMBER = 1;
    USER_ROLE_ADMIN = 2;
}

// Read and mutate user records.
service UserService {
    // Look up a user by id.
    rpc GetUser(GetUserRequest) returns (User);
}

message GetUserRequest {
    string id = 1;
}
