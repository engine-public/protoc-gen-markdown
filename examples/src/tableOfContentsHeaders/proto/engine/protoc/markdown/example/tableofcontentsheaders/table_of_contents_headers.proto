syntax = "proto3";

package engine.protoc.markdown.example.tableofcontentsheaders;

option java_package = "com.engine.protoc.markdown.example.tableofcontentsheaders";
option java_multiple_files = true;

// Exercises minTableOfContentsHeader=2,maxTableOfContentsHeader=3 — the resulting fixture
// has a TOC listing Services / Messages / Enums (h2) and their named children (h3).  Deeper
// headings emitted in the body (h4 Field Summary / RPC Summary / etc., h5 field/value/RPC
// expansions) are excluded by the max=3 cap; the L1 title heading is excluded by the min=2.

service Echo {
    rpc Send (Payload) returns (Payload);
}

message Payload {
    string body = 1;
}

enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_OK = 1;
}
