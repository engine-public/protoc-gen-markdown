syntax = "proto3";

package engine.protoc.markdown.example.generateinsertionpointsoff;

option java_package = "com.engine.protoc.markdown.example.generateinsertionpointsoff";
option java_multiple_files = true;

// Exercises the generateInsertionPoints=false path — the default emits the full insertion-
// point catalog (file_header / file_footer, every {services,messages,enums}_section, every
// type-scoped {service,message,enum}_*scope pair); this suite suppresses all of them and
// the fixture renders as plain Markdown with no `<!-- @@protoc_insertion_point(...) -->`
// comments.  A nested message and a nested enum cover the dotted-ancestor FQN form that
// would otherwise appear in the marker names (Outer.Inner / Outer.NestedEnum).

// Greeter is a tiny RPC so the Services section and a service_scope pair are emitted.
service Greeter {
    // SayHello is a single unary RPC.
    rpc SayHello (GreetingRequest) returns (GreetingResponse);
}

// GreetingRequest is the request payload.
message GreetingRequest {
    string name = 1;
}

// GreetingResponse is the response payload, and also hosts a nested message and a nested
// enum so the dotted-ancestor FQN form shows up in the marker names.
message GreetingResponse {
    string greeting = 1;

    // Metadata is nested so its insertion-point name is the dotted
    // `GreetingResponse.Metadata`.
    message Metadata {
        int64 generated_at_unix_millis = 1;
    }

    // Tone is a nested enum so its insertion-point name is the dotted
    // `GreetingResponse.Tone`.
    enum Tone {
        TONE_UNSPECIFIED = 0;
        TONE_FORMAL = 1;
        TONE_INFORMAL = 2;
    }
}

// Locale is a top-level enum so its insertion-point name is the bare `Locale`.
enum Locale {
    LOCALE_UNSPECIFIED = 0;
    LOCALE_EN_US = 1;
    LOCALE_FR_FR = 2;
}
