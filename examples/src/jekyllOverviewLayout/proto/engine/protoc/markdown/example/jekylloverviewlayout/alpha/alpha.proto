syntax = "proto3";

package engine.protoc.markdown.example.jekylloverviewlayout.alpha;

option java_package = "com.engine.protoc.markdown.example.jekylloverviewlayout.alpha";
option java_multiple_files = true;

// A message in the alpha package.
//
// With `overviewLayout=home` set, only the overview page receives `layout: "home"`; the package
// and per-file pages omit the key so their theme layout stays the default.
message Alpha {
    // The alpha's name.
    string name = 1;
}
